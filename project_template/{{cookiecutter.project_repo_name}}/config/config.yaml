# yamllint disable-file
global:
  dependencies:
    python:
      - forge-sdk==PLACEHOLDER
      - forge-cli==PLACEHOLDER
      - services/*.py
  env:
    PROJECT_SLUG: '{{ cookiecutter.project_slug }}'
    LOG_LEVEL: INFO
{% raw %}
    ARMORY_SITE_URL: '{{ "https://armory." + env.get("HOST_DOMAIN", "") }}'
    HOST_DOMAIN: '{{ env.get("HOST_DOMAIN", "") }}'

    # Cloud storage
    CLOUD_TYPE: 'AZURE'
    AZURE_ACCOUNT_URL: '{{ env.AZURE_ACCOUNT_URL }}'
    AZURE_ACCOUNT_KEY: '{{ env.AZURE_ACCOUNT_KEY }}'
    AZURE_MEDIA_CONTAINER: '{{ env.AZURE_MEDIA_CONTAINER }}'
    AZURE_MEDIA_FOLDER: ''

  cecs:
    params: -e *venv* migrations node_modules target .git .idea .vscode dist __pycache__

  repository: mindsmiths.azurecr.io


services:

  actions:
    type: python
    version: PLACEHOLDER
    image:
      static: true
    env:
      CONCURRENCY: 100
    resources:
      cpu: 50m
      memory: 250Mi

  ai_extractor:
    type: python
    version: PLACEHOLDER
    image:
      static: true
    env:
      CONCURRENCY: 5
    resources:
      cpu: 50m
      memory: 250Mi

  api_adapter:
    enabled: false
    type: python
    version: PLACEHOLDER
    resources:
      cpu: 50m
      memory: 50Mi

  armory:
    type: python
    version: PLACEHOLDER
    exposed: true
    image:
      static: true
    env:
      SITE_URL: '{{ "armory." + env.get("HOST_DOMAIN", "") }}'
      INTERNAL_SITE_URL: "armory"
      INTRO_SCREEN: "loader"
      X_FRAME_OPTIONS: "ALLOW"
      CORS_ALLOW_ALL_ORIGINS: true
    resources:
      cpu: 50m
      memory: 250Mi

  behavior_analyst:
    enabled: false
    type: python
    version: PLACEHOLDER
    db:
      mongo: true
    image:
      static: true
    resources:
      cpu: 50m
      memory: 100Mi

  business_data_analyst:
    type: python
    version: PLACEHOLDER
    db:
      mongo: true
    image:
      static: true
    resources:
      cpu: 50m
      memory: 150Mi

  chronos:
    type: python
    version: PLACEHOLDER
    db:
      mongo: true
