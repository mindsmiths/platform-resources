  cost_monitor:
    type: python
    version: PLACEHOLDER
    image:
      static: true
    db:
      mongo: true
    env:
      SMTP_SERVER: "{{ env.NOTIFICATIONS_SMTP_SERVER }}"
      SMTP_PORT: "{{ env.NOTIFICATIONS_SMTP_PORT }}"
      SMTP_EMAIL: "{{ env.NOTIFICATIONS_SMTP_FROM_EMAIL }}"
      SMTP_PASSWORD: "{{ env.NOTIFICATIONS_SMTP_PASSWORD }}"
      NAMESPACE: "{{ env.NAMESPACE }}"
    resources:
      cpu: 50m
      memory: 100Mi

  dashboard:
    type: python
    exposed: true
    version: PLACEHOLDER
    db:
      mongo: true
    image:
      static: true
    env:
      AUTH_SECRET_KEY: "{{ env.AUTH_SECRET_KEY }}"
      AUTH_2FA_ENABLED: {{ env.AUTH_2FA_ENABLED }}
      CI_TOKEN: '{{ env.PROJECT_CI_TRIGGER_TOKEN }}'
      CI_URL: '{{ env.PROJECT_CI_TRIGGER_URL }}'
      BRANCH: '{{ env.CI_COMMIT_BRANCH }}'
      AZURE_MEDIA_CONTAINER: public
      SUPERUSER_USERNAME: {{ env.SUPERUSER_USERNAME }}
      SUPERUSER_PASSWORD: {{ env.SUPERUSER_PASSWORD }}
      SUPERUSER_FIRST_NAME: {{ env.SUPERUSER_FIRST_NAME }}
      SUPERUSER_LAST_NAME: {{ env.SUPERUSER_LAST_NAME }}
      SUPERUSER_EMAIL: {{ env.SUPERUSER_EMAIL }}
      MIN_PASSWORD_LENGTH: {{ env.MIN_PASSWORD_LENGTH }}
      MIN_PASSWORD_SPECIAL_CHARACTERS: {{ env.MIN_PASSWORD_SPECIAL_CHARACTERS }}
      MIN_PASSWORD_NUMBERS: {{ env.MIN_PASSWORD_NUMBERS }}
      MIN_PASSWORD_UPPERCASE: {{ env.MIN_PASSWORD_UPPERCASE }}
      MIN_PASSWORD_LOWERCASE: {{ env.MIN_PASSWORD_LOWERCASE }}
      OAUTH_SERVER_REDIRECT_URI: '{{ env.OAUTH_SERVER_REDIRECT_URI }}'
      GOOGLE_OAUTH_CLIENT_ID: '{{ env.GOOGLE_CLIENT_ID }}'
      GOOGLE_OAUTH_CLIENT_SECRET: '{{ env.GOOGLE_CLIENT_SECRET }}'
      SMITH_USER_PASSWORD: "{{ env.SMITH_USER_PASSWORD }}"
      EMPLOYEE_DATA_URL: "{{ env.EMPLOYEE_DATA_URL }}"
      EMPLOYEE_DATA_USERNAME: "{{ env.EMPLOYEE_DATA_USERNAME }}"
      EMPLOYEE_DATA_PASSWORD: "{{ env.EMPLOYEE_DATA_PASSWORD }}"
      INFOBIP_BASE_URL: "{{ env.INFOBIP_BASE_URL }}"
      INFOBIP_API_KEY: "{{ env.INFOBIP_API_KEY }}"
      INFOBIP_PHONE_NUMBER: "{{ env.INFOBIP_PHONE_NUMBER }}"
      VERTEX_AI_CREDS: '{{ env.VERTEX_AI_CREDS }}'
    dependencies: []
#      - config/default_configurations/  # disable static image if uncommenting
    resources:
      cpu: 200m
      memory: 150Mi

